apiVersion: apps/v1
kind: Deployment
metadata:
  name: summit-client
  namespace: summit
  labels:
    app.kubernetes.io/name: summit-client
    app.kubernetes.io/part-of: summit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: summit-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: summit-client
        app.kubernetes.io/part-of: summit
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: ghcr.io/pilab-dev/summit-client:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: summit-client
  namespace: summit
  labels:
    app.kubernetes.io/name: summit-client
    app.kubernetes.io/part-of: summit
spec:
  selector:
    app.kubernetes.io/name: summit-client
  ports:
    - name: http
      port: 80
      targetPort: http

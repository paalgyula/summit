# MongoDB Atlas connection string for the game server.
#
# Create the real secret out of band, never commit it:
#   kubectl -n summit create secret generic summit-mongodb \
#     --from-literal=uri="mongodb+srv://USER:PASS@CLUSTER.mongodb.net/?retryWrites=true&w=majority"
#
# `scripts/deploy-summit.sh` will create it automatically from PROD_MONGO_URI
# (in .env or the environment) when it does not exist yet.
apiVersion: v1
kind: Secret
metadata:
  name: summit-mongodb
  namespace: summit
type: Opaque
stringData:
  uri: mongodb+srv://user:password@cluster.mongodb.net/?retryWrites=true&w=majority
